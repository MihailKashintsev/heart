<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeartAI — demorg</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --red:#ff0033;--red2:#cc0022;--glow:rgba(255,0,51,0.4);--faint:rgba(255,0,51,0.07);
  --bg:#05050a;--bg2:#0b0b14;--bg3:#11111c;--text:#ede6e6;
  --mono:'Share Tech Mono',monospace;--disp:'Orbitron',sans-serif;--sw:320px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:200;}
.app{display:flex;height:100vh;width:100vw;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sw);flex-shrink:0;background:var(--bg2);border-right:1px solid rgba(255,0,51,0.18);display:flex;flex-direction:column;transition:width .35s cubic-bezier(.4,0,.2,1),opacity .3s;overflow:hidden;}
.sidebar.collapsed{width:0;opacity:0;pointer-events:none;}
.sidebar-header{padding:18px 20px 14px;border-bottom:1px solid rgba(255,0,51,0.14);flex-shrink:0;background:linear-gradient(180deg,rgba(255,0,51,0.05) 0%,transparent 100%);}
.sidebar-title{font-family:var(--disp);font-size:11px;color:var(--red);letter-spacing:4px;text-shadow:0 0 8px var(--red);margin-bottom:14px;}
.sidebar-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:24px;}
.sidebar-body::-webkit-scrollbar{width:3px;}
.sidebar-body::-webkit-scrollbar-thumb{background:rgba(255,0,51,0.18);border-radius:2px;}
.sec-lbl{font-size:10px;letter-spacing:4px;color:rgba(255,0,51,0.38);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-lbl::after{content:'';flex:1;height:1px;background:rgba(255,0,51,0.1);}
.field-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.field-lbl{font-size:10px;color:rgba(255,0,51,0.38);letter-spacing:2px;width:48px;flex-shrink:0;}
.finp{flex:1;background:var(--bg3);border:1px solid rgba(255,0,51,0.14);border-radius:2px;padding:7px 10px;font-family:var(--mono);font-size:11px;color:rgba(255,0,51,0.65);outline:none;transition:border-color .2s;}
.finp:focus{border-color:rgba(255,0,51,0.38);box-shadow:0 0 8px rgba(255,0,51,0.2);}
.finp::placeholder{color:rgba(255,0,51,0.18);}
.pbtn{background:rgba(255,0,51,0.09);border:1px solid rgba(255,0,51,0.3);color:var(--red);font-family:var(--mono);font-size:10px;padding:8px;border-radius:2px;cursor:pointer;letter-spacing:2px;width:100%;transition:all .2s;text-shadow:0 0 5px var(--red);margin-top:4px;}
.pbtn:hover{background:rgba(255,0,51,0.18);box-shadow:0 0 10px var(--glow);}
.offline-banner{background:rgba(255,0,51,0.08);border:1px solid rgba(255,0,51,0.3);border-radius:2px;padding:10px 12px;font-size:10px;color:rgba(255,0,51,0.8);letter-spacing:1px;line-height:1.6;display:none;margin-bottom:4px;}
.offline-banner.show{display:block;}
.empty-lbl{font-size:10px;color:rgba(255,0,51,0.2);letter-spacing:2px;padding:6px 0;}
.kbtn{font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:2px;cursor:pointer;font-family:var(--mono);transition:all .2s;}
.kbtn.dl{background:transparent;border:1px solid rgba(255,0,51,0.1);color:rgba(255,0,51,0.28);}
.kbtn.dl:hover{background:rgba(255,0,51,0.14);border-color:rgba(255,0,51,0.3);color:var(--red);}
.gbtn{background:rgba(255,0,51,0.09);border:1px solid rgba(255,0,51,0.28);color:var(--red);font-family:var(--mono);font-size:10px;padding:8px 12px;border-radius:2px;cursor:pointer;letter-spacing:2px;flex-shrink:0;transition:all .2s;}
.gbtn:hover{background:rgba(255,0,51,0.18);box-shadow:0 0 8px var(--glow);}

/* CHATS */
.chat-actions{display:flex;gap:7px;margin-bottom:12px;}
.chat-actions .gbtn{flex:1;text-align:center;}
.chat-list{display:flex;flex-direction:column;gap:14px;}
.group-block{display:flex;flex-direction:column;gap:6px;}
.group-head{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:2px;color:rgba(255,0,51,0.45);text-transform:uppercase;}
.group-head .gname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-item{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:2px;background:var(--bg3);border:1px solid rgba(255,0,51,0.09);cursor:pointer;transition:all .2s;}
.chat-item:hover{border-color:rgba(255,0,51,0.25);}
.chat-item.active{border-color:var(--red);box-shadow:0 0 8px rgba(255,0,51,0.15);}
.chat-title{flex:1;font-size:11px;color:rgba(255,255,255,0.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-grp-sel{background:transparent;border:none;color:rgba(255,0,51,0.35);font-family:var(--mono);font-size:9px;outline:none;cursor:pointer;max-width:58px;flex-shrink:0;}
.chat-grp-sel option{background:var(--bg3);color:var(--text);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid rgba(255,0,51,0.16);background:linear-gradient(180deg,rgba(255,0,51,0.04) 0%,transparent 100%);flex-shrink:0;position:relative;z-index:10;}
.toggle-sidebar{width:32px;height:32px;background:var(--faint);border:1px solid rgba(255,0,51,0.2);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;-webkit-user-select:none;user-select:none;}
.toggle-sidebar:hover{background:rgba(255,0,51,0.14);box-shadow:0 0 10px var(--glow);}
.toggle-sidebar svg{width:14px;height:14px;fill:var(--red);transition:transform .35s;}
.sidebar.collapsed ~ .main .toggle-sidebar svg{transform:scaleX(-1);}

/* Heart container */
.heart-wrap{width:56px;height:56px;position:relative;flex-shrink:0;}
#heartCanvas{width:56px;height:56px;display:block;filter:drop-shadow(0 0 8px rgba(255,0,30,0.9)) drop-shadow(0 0 20px rgba(180,0,20,0.5));}
.hring{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,0,51,0.55);opacity:0;animation:hring 1.1s ease-out infinite;pointer-events:none;}
.hring:nth-child(2){animation-delay:.18s;}
@keyframes hring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}

/* Loading spinner for heart */
.heart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.heart-loading::after{content:'♥';font-size:18px;color:var(--red);animation:hpulse .8s ease-in-out infinite;text-shadow:0 0 8px var(--red);}
@keyframes hpulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.3);opacity:1}}

.brand{display:flex;flex-direction:column;}
.bname{font-family:var(--disp);font-size:19px;font-weight:900;color:var(--red);text-shadow:0 0 10px var(--red),0 0 26px var(--red2);letter-spacing:3px;line-height:1;}
.bsub{font-size:10px;color:rgba(255,0,51,0.42);letter-spacing:4px;margin-top:3px;}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,0,51,0.55);letter-spacing:2px;border:1px solid rgba(255,0,51,0.18);padding:5px 11px;border-radius:2px;background:var(--faint);}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
.messages::-webkit-scrollbar{width:3px;}
.messages::-webkit-scrollbar-thumb{background:rgba(255,0,51,0.18);border-radius:2px;}
.msg{display:flex;flex-direction:column;max-width:74%;animation:min .28s ease-out;}
@keyframes min{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;align-items:flex-end;}
.msg.ai{align-self:flex-start;align-items:flex-start;}
.mlbl{font-size:9px;letter-spacing:3px;margin-bottom:5px;text-transform:uppercase;}
.msg.user .mlbl{color:rgba(255,255,255,0.2);}
.msg.ai .mlbl{color:rgba(255,0,51,0.45);}
.mbub{padding:12px 16px;border-radius:2px;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
.msg.user .mbub{background:var(--bg3);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.8);border-top-right-radius:0;}
.msg.ai .mbub{background:var(--bg2);border:1px solid rgba(255,0,51,0.17);border-left:2px solid var(--red);color:var(--text);border-top-left-radius:0;}
.typing-bub{display:flex;align-items:center;gap:5px;padding:12px 16px;background:var(--bg2);border:1px solid rgba(255,0,51,0.17);border-left:2px solid var(--red);border-top-left-radius:0;width:fit-content;}
.typing-bub span{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 4px var(--red);animation:db 1.2s ease-in-out infinite;}
.typing-bub span:nth-child(2){animation-delay:.2s;}.typing-bub span:nth-child(3){animation-delay:.4s;}
@keyframes db{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* WELCOME */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;-webkit-user-select:none;user-select:none;}
.welcome-heart-wrap{width:220px;height:220px;position:relative;}
#heartCanvasLarge{width:220px;height:220px;display:block;filter:drop-shadow(0 0 24px rgba(255,0,30,0.7)) drop-shadow(0 0 60px rgba(150,0,10,0.5));}
.welcome-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
.welcome-loading-heart{font-size:52px;color:var(--red);animation:hpulse .8s ease-in-out infinite;text-shadow:0 0 20px var(--red);opacity:.6;}
.welcome-loading-txt{font-size:9px;color:rgba(255,0,51,0.3);letter-spacing:3px;}
.wt{font-family:var(--disp);font-size:11px;letter-spacing:6px;color:var(--red);opacity:.5;}
.ws{font-size:10px;color:rgba(255,0,51,0.28);letter-spacing:2px;}

/* INPUT */
.input-area{padding:14px 22px 16px;border-top:1px solid rgba(255,0,51,0.12);background:linear-gradient(0deg,rgba(255,0,51,0.02) 0%,transparent 100%);flex-shrink:0;}
.imeta{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.stgl{display:flex;align-items:center;gap:7px;font-size:10px;color:rgba(255,0,51,0.32);letter-spacing:2px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:color .2s;}
.stgl:hover{color:rgba(255,0,51,0.6);}
.spill{width:25px;height:13px;background:rgba(255,0,51,0.07);border:1px solid rgba(255,0,51,0.22);border-radius:7px;position:relative;transition:all .2s;}
.spill::after{content:'';width:7px;height:7px;background:rgba(255,0,51,0.32);border-radius:50%;position:absolute;top:2px;left:2px;transition:all .2s;}
.stgl.on .spill{background:rgba(255,0,51,0.18);border-color:var(--red);box-shadow:0 0 6px var(--glow);}
.stgl.on .spill::after{transform:translateX(12px);background:var(--red);box-shadow:0 0 4px var(--red);}
.stgl.on{color:rgba(255,0,51,0.72);}
.irow{display:flex;gap:9px;align-items:flex-end;}
.iwrap{flex:1;position:relative;}
.iwrap::before{content:'>';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--red);font-size:13px;pointer-events:none;text-shadow:0 0 6px var(--red);}
textarea{width:100%;background:var(--bg2);border:1px solid rgba(255,0,51,0.17);border-radius:2px;color:var(--text);font-family:var(--mono);font-size:13px;padding:12px 12px 12px 28px;resize:none;outline:none;min-height:46px;max-height:130px;transition:border-color .2s,box-shadow .2s;line-height:1.5;}
textarea:focus{border-color:rgba(255,0,51,0.4);box-shadow:0 0 12px var(--glow);}
textarea::placeholder{color:rgba(255,255,255,0.12);}
.sbtn{width:46px;height:46px;background:var(--faint);border:1px solid rgba(255,0,51,0.3);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.sbtn:hover{background:rgba(255,0,51,0.14);box-shadow:0 0 12px var(--glow);}
.sbtn:active{transform:scale(.93);}
.sbtn svg{width:16px;height:16px;fill:var(--red);filter:drop-shadow(0 0 3px var(--red));}
.ihint{font-size:9px;color:rgba(255,255,255,0.09);letter-spacing:1px;margin-top:6px;padding-left:28px;}
.corner{position:fixed;width:34px;height:34px;pointer-events:none;z-index:300;}
.corner::before,.corner::after{content:'';position:absolute;background:var(--red);box-shadow:0 0 4px var(--red);}
.corner::before{width:100%;height:1px;top:0;left:0;}.corner::after{width:1px;height:100%;top:0;left:0;}
.corner.tl{top:7px;left:7px}.corner.tr{top:7px;right:7px;transform:scaleX(-1)}
.corner.bl{bottom:7px;left:7px;transform:scaleY(-1)}.corner.br{bottom:7px;right:7px;transform:scale(-1)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--bg3);border:1px solid rgba(255,0,51,0.3);color:var(--red);font-family:var(--mono);font-size:10px;letter-spacing:2px;padding:8px 16px;border-radius:2px;box-shadow:0 0 18px var(--glow);opacity:0;transition:all .28s;pointer-events:none;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ══ MOBILE OVERLAY ══ */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:150;backdrop-filter:blur(2px);}
.sidebar-overlay.show{display:block;}

/* ══ MOBILE ══ */
@media(max-width:600px){
  :root{--sw:100vw;}

  /* Sidebar поверх контента, а не рядом */
  .sidebar{
    position:fixed;top:0;left:0;height:100%;
    z-index:200;
    transform:translateX(0);
    transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s;
    width:88vw !important;
    max-width:360px;
  }
  .sidebar.collapsed{
    transform:translateX(-110%);
    opacity:1;
    pointer-events:none;
  }

  /* Хедер компактнее */
  header{padding:8px 12px;gap:8px;}
  .bsub{display:none;}
  .bname{font-size:15px;letter-spacing:2px;}
  .heart-wrap{width:40px;height:40px;}
  #heartCanvas{width:40px;height:40px;}
  .hring{inset:-6px;}

  /* Статус — только точка на мобиле */
  .status{padding:5px 8px;letter-spacing:0px;font-size:9px;}
  #statusText{display:none;}
  .sdot{width:8px;height:8px;}

  /* Сообщения */
  .messages{padding:14px 12px;gap:12px;}
  .msg{max-width:90%;}
  .mbub{font-size:13px;padding:10px 12px;}

  /* Welcome сердце меньше */
  .welcome-heart-wrap{width:140px;height:140px;}
  #heartCanvasLarge{width:140px;height:140px;}
  .wt{font-size:9px;letter-spacing:4px;}
  .ws{font-size:9px;}

  /* Инпут */
  .input-area{padding:10px 12px 12px;}
  .imeta{margin-bottom:6px;}
  .ihint{display:none;}
  textarea{font-size:16px; /* iOS не зумит при font-size>=16px */}
  .sbtn{width:44px;height:44px;}

  /* Углы убираем на мобиле */
  .corner{display:none;}

  /* Тост выше клавиатуры */
  .toast{bottom:80px;}
}

/* Планшет */
@media(min-width:601px) and (max-width:900px){
  :root{--sw:280px;}
  .bsub{display:none;}
  .msg{max-width:86%;}
}
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="app">

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">☰ ПАНЕЛЬ</div>
      <div class="status" style="width:100%">
        <div class="sdot" id="sdot2"></div>
        <span id="stxt2">CONNECTING</span>
      </div>
    </div>
    <div class="sidebar-body">
      <div>
        <div class="offline-banner" id="offlineBanner">
          ⚠ Сервер недоступен.<br>
          Запусти ячейку 8 в Colab и вставь новый URL ниже.
        </div>
      </div>
      <div>
        <div class="sec-lbl">Чаты</div>
        <div class="chat-actions">
          <button class="gbtn" onclick="newChat()">+ ЧАТ</button>
          <button class="gbtn" onclick="newGroup()">+ ГРУППА</button>
        </div>
        <div class="chat-list" id="chatList"></div>
      </div>
      <div>
        <div class="sec-lbl">Сервер</div>
        <div class="field-row"><span class="field-lbl">URL</span><input class="finp" id="sUrl" type="text" placeholder="https://xxxx.hf.space"/></div>
        <button class="pbtn" onclick="saveDefault()">СОХРАНИТЬ И ПЕРЕПОДКЛЮЧИТЬ</button>
      </div>
    </div>
  </div>

  <div class="main" id="main">
    <header>
      <button class="toggle-sidebar" id="toggleBtn" onclick="toggleSidebar()" aria-label="Свернуть панель" title="Свернуть/развернуть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="heart-wrap">
        <div class="hring"></div><div class="hring"></div>
        <div class="heart-loading" id="heartLoading"></div>
        <canvas id="heartCanvas" aria-label="HeartAI логотип"></canvas>
      </div>
      <div class="brand">
        <span class="bname">HeartAI</span>
        <span class="bsub">powered by demorg</span>
      </div>
      <div class="hright">
        <div class="status">
          <div class="sdot" id="statusDot"></div>
          <span id="statusText">CONNECTING</span>
        </div>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-heart-wrap">
          <div class="welcome-loading" id="welcomeLoading">
            <div class="welcome-loading-heart">♥</div>
            <div class="welcome-loading-txt">ЗАГРУЗКА МОДЕЛИ</div>
          </div>
          <canvas id="heartCanvasLarge" aria-label="Большое сердце HeartAI"></canvas>
        </div>
        <div class="wt">HEARTAI / demorg</div>
        <div class="ws">МОДЕЛЬ АКТИВНА — НАЧНИ ДИАЛОГ</div>
      </div>
    </div>

    <div class="input-area">
      <div class="imeta">
        <div class="stgl" id="searchToggle" onclick="toggleSearch()" role="button" tabindex="0" aria-label="Включить веб-поиск">
          <div class="spill"></div>ВЕБ-ПОИСК
        </div>
      </div>
      <div class="irow">
        <div class="iwrap">
          <textarea id="input" placeholder="Задай вопрос demorg..." rows="1"
            onkeydown="handleKey(event)" oninput="autoResize(this)" aria-label="Поле ввода"></textarea>
        </div>
        <button class="sbtn" onclick="sendMessage()" aria-label="Отправить" title="Отправить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
      <div class="ihint">ENTER — отправить · SHIFT+ENTER — новая строка</div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Three.js + GLTFLoader — SAME cdn.jsdelivr.net source, same version -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ════════════════════════════════════════════
//  3D HEART — loads heart.glb from same folder
//  Falls back to procedural if file not found
// ════════════════════════════════════════════

// Auto-detect path: works both on GitHub Pages and locally via Live Server
const MODEL_URL = (()=>{
  const base = window.location.href.replace(/\/[^/]*$/, '/');
  return base + 'heart.glb';
})();
console.log('🫀 Loading heart from:', MODEL_URL);

// Shared state for both hearts
const hearts = {};
let clock = 0;
let modelLoaded = false;

function buildScene(canvas, size) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setSize(size * dpr, size * dpr, false);
  renderer.setPixelRatio(dpr);
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 2.8;
  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
  camera.position.set(0, 0, 3.5);
  camera.lookAt(0, 0, 0);

  // Lights
  const key = new THREE.DirectionalLight(0xffffff, 6.0);
  key.position.set(-2, 3, 4);
  scene.add(key);

  const rim = new THREE.DirectionalLight(0xffffff, 2.0);
  rim.position.set(3, 0, -3);
  scene.add(rim);

  const sss = new THREE.DirectionalLight(0xff1100, 1.8);
  sss.position.set(0, -4, 1);
  scene.add(sss);

  scene.add(new THREE.AmbientLight(0xff2222, 3.5));

  const glowPt = new THREE.PointLight(0xff0020, 8.0, 6);
  glowPt.position.set(0, 0, 1.5);
  scene.add(glowPt);

  const group = new THREE.Group();
  scene.add(group);

  return { renderer, scene, camera, group, glowPt };
}

// Red override material — applied to loaded model
function makeRedMat(roughness, emissiveStr) {
  return new THREE.MeshStandardMaterial({
    color:     new THREE.Color(0xaa0015),
    roughness: roughness,
    metalness: 0.05,
    emissive:  new THREE.Color(0xff0030),
    emissiveIntensity: Math.max(emissiveStr, 0.6),
  });
}

// Apply red materials recursively to loaded model
function applyRedMaterials(obj) {
  obj.traverse(child => {
    if (child.isMesh) {
      child.castShadow    = true;
      child.receiveShadow = true;
      // Vary roughness slightly per mesh for depth
      const r = 0.35 + Math.random() * 0.35;
      const e = 0.08 + Math.random() * 0.14;
      child.material = makeRedMat(r, e);
    }
  });
}

// Center and scale model to fit scene
function fitModel(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale  = 2.0 / maxDim;
  obj.scale.setScalar(scale);
  obj.position.sub(center.multiplyScalar(scale));
}

// Procedural fallback heart (simple, reliable)
function buildFallbackHeart(group) {
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(0xaa0015), roughness:0.5, metalness:0.04,
    emissive: new THREE.Color(0xff0030), emissiveIntensity:0.8,
  });

  function defSphere(geo, fn) {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const [nx,ny,nz] = fn(p.getX(i), p.getY(i), p.getZ(i));
      p.setXYZ(i, nx, ny, nz);
    }
    geo.computeVertexNormals();
    return geo;
  }

  const lvG = defSphere(new THREE.SphereGeometry(0.9,48,48),(x,y,z)=>{
    const t=(y+0.9)/1.8, r=0.42+0.58*t;
    return [x*r, y*1.25, z*r*0.80];
  });
  const lv = new THREE.Mesh(lvG, mat); lv.position.set(-0.08,-0.05,0); group.add(lv);

  const rvG = defSphere(new THREE.SphereGeometry(0.65,36,36),(x,y,z)=>{
    const t=(y+0.65)/1.3, r=0.5+0.5*t;
    return [x*0.78, y*1.05, z*0.48*r];
  });
  const rv = new THREE.Mesh(rvG, mat); rv.position.set(0.58,-0.02,0.22); group.add(rv);

  const la = new THREE.Mesh(new THREE.SphereGeometry(0.46,32,32), mat);
  la.scale.set(1.1,0.88,0.80); la.position.set(-0.28,0.78,-0.34); group.add(la);

  const ra = new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32), mat);
  ra.scale.set(1.0,0.86,0.82); ra.position.set(0.45,0.76,0.08); group.add(ra);

  // Aorta
  const aPts=[new THREE.Vector3(-0.08,0.90,0.06),new THREE.Vector3(-0.05,1.28,0.10),new THREE.Vector3(0.18,1.65,-0.06),new THREE.Vector3(0.65,1.45,-0.28)];
  const aG = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(aPts),20,0.16,10,false);
  group.add(new THREE.Mesh(aG, mat));

  const apex = new THREE.Mesh(new THREE.SphereGeometry(0.22,24,24), mat);
  apex.scale.set(0.85,1.1,0.72); apex.position.set(-0.12,-1.10,0.08); group.add(apex);
}

// Init two scenes
const sm = buildScene(document.getElementById('heartCanvas'), 56);
const lg = buildScene(document.getElementById('heartCanvasLarge'), 220);

// Load GLB model
const loader = new THREE.GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
    // Success — clone for both scenes
    const modelSm = gltf.scene.clone(true);
    const modelLg = gltf.scene.clone(true);

    applyRedMaterials(modelSm);
    applyRedMaterials(modelLg);
    fitModel(modelSm);
    fitModel(modelLg);

    sm.group.add(modelSm);
    lg.group.add(modelLg);

    modelLoaded = true;

    // Hide loading indicators
    document.getElementById('heartLoading').style.display = 'none';
    document.getElementById('welcomeLoading').style.display = 'none';

    console.log('✅ Heart model loaded');
  },
  (progress) => {
    if (progress.total > 0) {
      const pct = Math.round(progress.loaded / progress.total * 100);
      const el = document.getElementById('welcomeLoading');
      if (el) el.querySelector('.welcome-loading-txt').textContent = `ЗАГРУЗКА ${pct}%`;
    }
  },
  (error) => {
    // Fallback — procedural heart
    console.error('❌ GLB failed to load:', error);
    console.error('   Tried URL:', MODEL_URL);
    console.warn('↩ Using procedural fallback');
    buildFallbackHeart(sm.group);
    buildFallbackHeart(lg.group);
    modelLoaded = true;
    document.getElementById('heartLoading').style.display = 'none';
    document.getElementById('welcomeLoading').style.display = 'none';
  }
);

// Beat curve
function beatScale(t) {
  const p = (t % 1.1) / 1.1;
  if (p < 0.07) return 1 + 0.15 * Math.sin(p / 0.07 * Math.PI);
  if (p < 0.20) return 1 + 0.07 * Math.sin((p - 0.13) / 0.07 * Math.PI);
  return 1.0;
}

let isAIThinking = false;
let baseGlowIntensity = 0.5;
let thinkingGlowIntensity = 28;
let currentGlowIntensity = baseGlowIntensity;

function setAIThinking(thinking) {
  isAIThinking = thinking;
}

function animate() {
  requestAnimationFrame(animate);
  clock += 0.016;
  const sc = beatScale(clock);

  // Adjust glow intensity and rhythm based on AI state
  if (isAIThinking) {
    // When AI is thinking/responding, increase glow intensity and speed
    currentGlowIntensity = baseGlowIntensity + (thinkingGlowIntensity * (0.5 + 0.5 * Math.sin(clock * 2)));
  } else {
    // When waiting for user, slower rhythm and darker heart
    currentGlowIntensity = baseGlowIntensity + (0.3 * Math.sin(clock * 0.3));
  }

  if (modelLoaded) {
    // Adjust rotation speed based on state
    const rotSpeed = isAIThinking ? 0.012 : 0.005;
    sm.group.rotation.y += rotSpeed;
    lg.group.rotation.y += rotSpeed * 1.2;
    
    // Scale pulse
    const scaleSpeed = isAIThinking ? 1.2 : 0.8;
    const scaleFactor = 1 + (scaleSpeed - 1) * (sc - 1);
    sm.group.scale.setScalar(scaleFactor);
    lg.group.scale.setScalar(scaleFactor);
    
    // Update glow intensity
    sm.glowPt.intensity = currentGlowIntensity;
    lg.glowPt.intensity = currentGlowIntensity * 1.2;
    
    // Adjust material emissive properties based on state
    sm.group.traverse(child => {
      if (child.isMesh && child.material) {
        if (isAIThinking) {
          // When thinking, make the heart brighter and more vibrant
          child.material.emissiveIntensity = 0.8 + 0.4 * Math.sin(clock * 3);
          child.material.color = new THREE.Color(1.0, 0.2, 0.3);
        } else {
          // When waiting, make the heart darker with slower pulse
          child.material.emissiveIntensity = 0.3 + 0.1 * Math.sin(clock * 0.3);
          child.material.color = new THREE.Color(0.8, 0.0, 0.1);
        }
      }
    });
    
    lg.group.traverse(child => {
      if (child.isMesh && child.material) {
        if (isAIThinking) {
          child.material.emissiveIntensity = 1.0 + 0.6 * Math.sin(clock * 3);
          child.material.color = new THREE.Color(1.0, 0.2, 0.3);
        } else {
          child.material.emissiveIntensity = 0.4 + 0.15 * Math.sin(clock * 0.3);
          child.material.color = new THREE.Color(0.8, 0.0, 0.1);
        }
      }
    });
  }

  sm.renderer.render(sm.scene, sm.camera);
  lg.renderer.render(lg.scene, lg.camera);
}
animate();

//  APP LOGIC
// ════════════════════════════════
const BUILT_IN = {
  url: 'https://heartai-space.onrender.com',
  key: 'sk-my-main-key-001',
  version: 2 // увеличивать при каждой смене BUILT_IN.url на деплое — иначе
             // старый URL, сохранённый в localStorage с прошлого визита,
             // молча перебивает новый дефолт
};
// Ключ больше не редактируется из UI (см. настройки) — всегда вшитый.
// URL можно переопределить вручную и он переживает перезагрузку страницы,
// но только пока version совпадает — иначе побеждает новый вшитый адрес.
const savedCfg = JSON.parse(localStorage.getItem('heartai_cfg') || 'null');
let cfg = (savedCfg && savedCfg.version === BUILT_IN.version)
  ? { ...BUILT_IN, ...savedCfg, key: BUILT_IN.key }
  : { ...BUILT_IN };
let useSearch   = false;
let connected   = false;
let sidebarOpen = true;
let retryCount  = 0;
let groups = JSON.parse(localStorage.getItem('heartai_groups') || '[]');
let chats  = JSON.parse(localStorage.getItem('heartai_chats')  || '[]');
let currentChatId = null;
const MAX_RETRY = 8;

window.onload = () => {
  document.getElementById('sUrl').value = cfg.url;
  renderChatList();
  restoreLastChat();
  autoConnect();
};

function isMobile(){ return window.innerWidth <= 600; }

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
  // Overlay только на мобиле
  const overlay = document.getElementById('sidebarOverlay');
  if(isMobile()){
    overlay.classList.toggle('show', sidebarOpen);
  } else {
    overlay.classList.remove('show');
  }
}

function autoConnect() {
  if (retryCount === 0) setStatus('CONNECTING', false);
  else setStatus('ПРОБУЖДЕНИЕ ' + retryCount + '/' + MAX_RETRY + '...', false);

  const ctrl = typeof AbortSignal !== 'undefined' && AbortSignal.timeout
    ? { signal: AbortSignal.timeout(15000) } : {};

  fetch(cfg.url + '/v1/health', Object.assign({
    headers:{ 'Authorization': 'Bearer ' + cfg.key }
  }, ctrl))
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => {
    connected  = true;
    retryCount = 0;
    document.getElementById('offlineBanner').classList.remove('show');
    setStatus('ONLINE · ' + (d.parameters || 'demorg'), true);
    const chat = ensureChat();
    if (chat.messages.length === 0) {
      hideWelcome();
      addAI('Система инициализирована.\nМодель demorg активна. Сердце бьётся.\n\nЧем могу помочь?');
    }
  })
  .catch(() => {
    connected = false;
    retryCount++;
    const banner = document.getElementById('offlineBanner');
    if (retryCount <= MAX_RETRY) {
      const delay = retryCount <= 3 ? 5000 : 10000;
      setStatus('ПРОБУЖДЕНИЕ ' + retryCount + '/' + MAX_RETRY + '...', false);
      banner.innerHTML = '⏳ HuggingFace Space просыпается...<br>Попытка ' + retryCount + '/' + MAX_RETRY + ' — подожди ~30 секунд';
      banner.classList.add('show');
      setTimeout(autoConnect, delay);
    } else {
      retryCount = 0;
      setStatus('OFFLINE', false);
      sidebarOpen = true;
      document.getElementById('sidebar').classList.remove('collapsed');
      if(isMobile()) document.getElementById('sidebarOverlay').classList.add('show');
      banner.innerHTML = '⚠ Не удалось подключиться.<br>Обнови URL сервера ниже или проверь Space на HuggingFace.';
      banner.classList.add('show');
    }
  });
}

function setStatus(t, on) {
  ['statusText','stxt2'].forEach(id => document.getElementById(id).textContent = t);
  ['statusDot','sdot2'].forEach(id => {
    const d = document.getElementById(id);
    d.style.background = on ? '#ff0033' : '#550011';
    d.style.boxShadow  = on ? '0 0 6px #ff0033' : 'none';
    d.style.animation  = on ? 'blink 2s ease-in-out infinite' : 'none';
  });
}

function saveDefault() {
  const url = document.getElementById('sUrl').value.trim().replace(/\/$/,'');
  if (!url) { toast('Заполни URL'); return; }
  cfg = { ...cfg, url, version: BUILT_IN.version };
  localStorage.setItem('heartai_cfg', JSON.stringify(cfg));
  toast('Сохранено — переподключаюсь...');
  connected = false;
  setTimeout(autoConnect, 500);
}

// ── ЧАТЫ И ГРУППЫ ──────────────────────────────────
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function persistChats(){ localStorage.setItem('heartai_chats', JSON.stringify(chats)); }
function persistGroups(){ localStorage.setItem('heartai_groups', JSON.stringify(groups)); }
function persistCurrent(){
  if (currentChatId) localStorage.setItem('heartai_current_chat', currentChatId);
  else localStorage.removeItem('heartai_current_chat');
}
function getCurrentChat(){ return chats.find(c => c.id === currentChatId) || null; }
function ensureChat(){ return getCurrentChat() || newChat(); }

function chatTitleFrom(text){
  const t = text.trim().replace(/\s+/g,' ');
  return t.length > 34 ? t.slice(0,34) + '…' : (t || 'Новый чат');
}

function newChat(){
  const chat = { id: uid(), title: 'Новый чат', groupId: null, messages: [], ts: Date.now() };
  chats.unshift(chat);
  currentChatId = chat.id;
  persistChats(); persistCurrent();
  renderChatList();
  renderMessages(chat);
  return chat;
}

function newGroup(){
  const name = prompt('Название группы:');
  if (!name || !name.trim()) return;
  groups.push({ id: uid(), name: name.trim() });
  persistGroups();
  renderChatList();
}

function selectChat(id){
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  currentChatId = id;
  persistCurrent();
  renderChatList();
  renderMessages(chat);
  if (isMobile() && sidebarOpen) toggleSidebar();
}

function deleteChat(id, ev){
  ev.stopPropagation();
  if (!confirm('Удалить чат безвозвратно?')) return;
  chats = chats.filter(c => c.id !== id);
  persistChats();
  if (currentChatId === id) {
    currentChatId = null;
    persistCurrent();
    clearMessageBubbles();
    showWelcome();
  }
  renderChatList();
  toast('Чат удалён');
}

function deleteGroup(id, ev){
  ev.stopPropagation();
  if (!confirm('Удалить группу? Чаты внутри останутся, но станут без группы.')) return;
  chats.forEach(c => { if (c.groupId === id) c.groupId = null; });
  groups = groups.filter(g => g.id !== id);
  persistChats(); persistGroups();
  renderChatList();
  toast('Группа удалена');
}

function setChatGroup(id, groupId){
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  chat.groupId = groupId || null;
  persistChats();
  renderChatList();
}

function renderChatList(){
  const el = document.getElementById('chatList');
  if (!chats.length) { el.innerHTML = '<div class="empty-lbl">НЕТ ЧАТОВ</div>'; return; }

  const groupOpts = (selectedId) => '<option value="">без группы</option>' +
    groups.map(g => `<option value="${g.id}" ${g.id===selectedId?'selected':''}>${esc(g.name)}</option>`).join('');

  const chatItem = (c) => `
    <div class="chat-item ${c.id===currentChatId?'active':''}" onclick="selectChat('${c.id}')">
      <span class="chat-title">${esc(c.title)}</span>
      <select class="chat-grp-sel" onclick="event.stopPropagation()" onchange="setChatGroup('${c.id}', this.value)">${groupOpts(c.groupId)}</select>
      <button class="kbtn dl" onclick="deleteChat('${c.id}', event)" aria-label="Удалить чат" title="Удалить чат">×</button>
    </div>`;

  const byRecent = (a,b) => b.ts - a.ts;
  let html = '';

  groups.forEach(g => {
    const groupChats = chats.filter(c => c.groupId === g.id).sort(byRecent);
    html += `
      <div class="group-block">
        <div class="group-head">
          <span class="gname">${esc(g.name)}</span>
          <button class="kbtn dl" onclick="deleteGroup('${g.id}', event)" aria-label="Удалить группу" title="Удалить группу">×</button>
        </div>
        ${groupChats.length ? groupChats.map(chatItem).join('') : '<div class="empty-lbl">пусто</div>'}
      </div>`;
  });

  const ungrouped = chats.filter(c => !c.groupId).sort(byRecent);
  if (ungrouped.length) {
    html += `
      <div class="group-block">
        ${groups.length ? '<div class="group-head"><span class="gname">БЕЗ ГРУППЫ</span></div>' : ''}
        ${ungrouped.map(chatItem).join('')}
      </div>`;
  }

  el.innerHTML = html;
}

function restoreLastChat(){
  const savedId = localStorage.getItem('heartai_current_chat');
  const chat = savedId && chats.find(c => c.id === savedId);
  if (!chat) return;
  currentChatId = chat.id;
  renderChatList();
  renderMessages(chat);
}

function showWelcome(){
  const w = document.getElementById('welcome');
  if (!w) return;
  w.style.display = 'flex';
  requestAnimationFrame(() => { w.style.opacity = '1'; });
}
function hideWelcome(){
  const w=document.getElementById('welcome');
  if(w){ w.style.opacity='0'; w.style.transition='opacity .3s';
    setTimeout(()=>{ w.style.display='none'; }, 300); }
}
function clearMessageBubbles(){
  document.querySelectorAll('#messages .msg').forEach(n => n.remove());
}
function renderMessages(chat){
  clearMessageBubbles();
  if (!chat.messages.length) { showWelcome(); return; }
  hideWelcome();
  const m = document.getElementById('messages');
  chat.messages.forEach(msg => {
    const d = document.createElement('div');
    d.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
    d.innerHTML = `<div class="mlbl">${msg.role==='user' ? 'ВЫ' : 'HEARTAI · demorg'}</div><div class="mbub">${esc(msg.text)}</div>`;
    m.appendChild(d);
  });
  m.scrollTop = m.scrollHeight;
}

function toggleSearch(){ useSearch=!useSearch; document.getElementById('searchToggle').classList.toggle('on',useSearch); }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,130)+'px'; }
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

function addUser(text){
  const m=document.getElementById('messages');
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="mlbl">ВЫ</div><div class="mbub">${esc(text)}</div>`;
  m.appendChild(d); m.scrollTop=m.scrollHeight;
  const chat = getCurrentChat();
  if (!chat) return;
  chat.messages.push({role:'user', text});
  if (chat.messages.filter(x => x.role==='user').length === 1) chat.title = chatTitleFrom(text);
  chat.ts = Date.now();
  persistChats();
  renderChatList();
}
function addAI(text){
  const m=document.getElementById('messages');
  const d=document.createElement('div'); d.className='msg ai';
  d.innerHTML=`<div class="mlbl">HEARTAI · demorg</div><div class="mbub">${esc(text)}</div>`;
  m.appendChild(d); m.scrollTop=m.scrollHeight;
  const chat = getCurrentChat();
  if (!chat) return;
  chat.messages.push({role:'ai', text});
  chat.ts = Date.now();
  persistChats();
}
function showTyping(){
  const m=document.getElementById('messages');
  const d=document.createElement('div'); d.className='msg ai'; d.id='typing';
  d.innerHTML=`<div class="mlbl">HEARTAI · demorg</div><div class="typing-bub"><span></span><span></span><span></span></div>`;
  m.appendChild(d); m.scrollTop=m.scrollHeight;
}
function hideTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

async function sendMessage(){
  const inp=document.getElementById('input');
  const txt=inp.value.trim(); if(!txt) return;
  // Закрываем сайдбар на мобиле при отправке
  if(isMobile() && sidebarOpen){ toggleSidebar(); }
  ensureChat();
  hideWelcome(); addUser(txt);
  inp.value=''; inp.style.height='auto';
  showTyping();
  try {
    const r = await fetch(`${cfg.url}/v1/ask`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${cfg.key}`,'Content-Type':'application/json'},
      body:JSON.stringify({question:txt, use_search:useSearch})
    });
    const d = await r.json();
    hideTyping();
    if(d.answer)      addAI(d.answer);
    else if(d.detail) addAI('⚠ '+d.detail);
    else              addAI('⚠ Неожиданный ответ');
    connected=true; setStatus('ONLINE · demorg',true);
  } catch(e){
    hideTyping();
    addAI('⚠ Потеряно соединение.\n☰ → обнови URL сервера.');
    connected=false; setStatus('OFFLINE',false);
    sidebarOpen=true;
    document.getElementById('sidebar').classList.remove('collapsed');
    document.getElementById('offlineBanner').classList.add('show');
  }
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
</script>
